# REFERENCE ONLY -- do not paste this into the site.
#
# tools/install.sh generates this same `location ^~ /helper/` block in the Carbon
# site (port 8767). Adding a second copy by hand makes `nginx -t` fail on the
# duplicate location, and nginx then refuses to start at the next boot. To change
# the block, change tools/install.sh and re-run it with the same --root.
# install_helper.sh checks that the running site carries exactly one such block.
#
# Loopback ONLY. Wifi and backlight belong to whoever is standing at the printer,
# not to the LAN. This is why Chromium on the panel must open
# http://127.0.0.1:8767/screen.html and not http://voron.local:8767/ -- through
# the hostname the request arrives on the LAN address and is denied here.
location ^~ /helper/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # The address of the socket nginx accepted this connection on: 127.0.0.1 or ::1
    # only for a client on this machine that dialled loopback. The realip module
    # cannot rewrite it (it rewrites $remote_addr), and proxy_set_header replaces any
    # header of this name the client sent. The helper refuses every request without it.
    proxy_set_header X-Carbon-Local-Addr $server_addr;
    proxy_read_timeout 240s;     # above a wifi connect's worst case with cleanup and rollback: CONNECT_CEILING, 217 s
    proxy_buffering off;
}
