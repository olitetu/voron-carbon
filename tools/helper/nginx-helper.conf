# Add this location block to the Carbon site (the one tools/install.sh generates
# for port 8767), beside the /websocket and ~ ^/(printer|api|...)/ locations.
#
# Loopback ONLY. Wifi and backlight belong to whoever is standing at the printer,
# not to the LAN. This is why Chromium on the panel must open
# http://127.0.0.1:8767/screen.html and not http://voron.local:8767/ -- through
# the hostname the request arrives from the LAN address and is denied here.
location ^~ /helper/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 210s;     # above a wifi connect's worst case with rollback: CONNECT_CEILING, 182 s
    proxy_buffering off;
}
